name: "\U0001F41B Bug Report"
description: "Create a report to help us improve Repopilot"
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When I run repopilot on..., this happens..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Steps to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Repopilot Version"
      description: "Which version of Repopilot are you using?"
      placeholder: "v1.2.0"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context / Logs"
      description: "Add any other context or screenshots about the problem here. Logs are very helpful."
    validations:
      required: false
