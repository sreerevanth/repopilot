name: Import Guard

# Catches the failure mode that has broken `main` twice: a merge drops a
# definition (an import, a base class, a constant) while keeping every
# reference to it. Nothing in the existing checks fails on that, because the
# test suite cannot even be collected once a module stops importing.
#
# Deliberately does not run the test suite. This is the check that must stay
# green when everything else is red, so it has no dependency on test state.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  imports:
    name: Package imports and CLI starts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Every module imports
        # Walks modules/ rather than naming them, so a new module is covered
        # the day it lands instead of whenever someone remembers to add it.
        run: |
          python - <<'PY'
          import importlib, pathlib, sys

          failures = []
          for path in sorted(pathlib.Path("modules").glob("*.py")):
              if path.stem == "__init__":
                  continue
              name = f"modules.{path.stem}"
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failures.append((name, f"{type(exc).__name__}: {exc}"))

          for name, err in failures:
              print(f"FAIL {name}: {err}")

          if failures:
              print(f"\n{len(failures)} module(s) could not be imported.")
              print("This usually means a merge dropped a definition while")
              print("keeping the references to it.")
              sys.exit(1)

          print("all modules import")
          PY

      - name: CLI starts
        # --help exercises argparse, which catches duplicate flags and repeated
        # keyword arguments that a plain import does not reach.
        run: python main.py --help > /dev/null

      - name: No duplicate CLI flags
        run: |
          python - <<'PY'
          import collections, re, sys

          flags = re.findall(r'add_argument\(\s*"(--[a-z0-9-]+)"', open("main.py").read())
          dupes = {f: c for f, c in collections.Counter(flags).items() if c > 1}

          if dupes:
              for flag, count in sorted(dupes.items()):
                  print(f"FAIL {flag} registered {count} times")
              sys.exit(1)

          print(f"{len(flags)} CLI flags, no duplicates")
          PY

      - name: Every args.X is registered
        # main.py referenced args.list_resumable while the flag itself was lost
        # in a merge. --help still passed, because argparse only fails on a flag
        # it is asked for -- not on one the code reads and it never declared.
        run: |
          python - <<'PY'
          import re, sys

          source = open("main.py").read()
          used = set(re.findall(r"args\.(\w+)", source))

          declared = set(
              re.findall(r'add_argument\([^)]*?dest="(\w+)"', source, re.S)
          )
          declared |= {
              flag.replace("-", "_")
              for flag in re.findall(r'add_argument\(\s*"--([a-z0-9-]+)"', source)
          }

          missing = sorted(used - declared)
          for name in missing:
              print(f"FAIL args.{name} is read but never registered")

          if missing:
              sys.exit(1)

          print(f"{len(used)} args references, all registered")
          PY

      - name: AgentConfig accepts everything main.py passes
        # main.py passed plan_first and resume_from after both fields were lost
        # from the dataclass, so every run died with TypeError at construction.
        run: |
          python - <<'PY'
          import ast, dataclasses, sys

          from modules.agent_loop import AgentConfig

          fields = {f.name for f in dataclasses.fields(AgentConfig)}
          source = open("main.py").read()

          # Parsed rather than sliced. The previous version cut from
          # "config = AgentConfig(" to the next "\n    )", which swept up any
          # other multi-line call inside that span. run_tasks() and clean()
          # both sit there now, so their keyword arguments were reported as
          # missing AgentConfig fields -- four false failures.
          passed = set()
          for node in ast.walk(ast.parse(source)):
              if not isinstance(node, ast.Call):
                  continue
              called = getattr(node.func, "id", None) or getattr(node.func, "attr", None)
              if called == "AgentConfig":
                  passed.update(kw.arg for kw in node.keywords if kw.arg)

          missing = sorted(passed - fields)
          for name in missing:
              print(f"FAIL main.py passes {name}=, AgentConfig has no such field")

          if missing:
              sys.exit(1)

          print(f"{len(passed)} config arguments, all accepted")
          PY

      - name: Smoke run
        # The check the guard was missing. --context-only compiles the context
        # and returns before any provider call, so this exercises argparse,
        # config construction, ingestion, context building and the run summary
        # without an API key and without spending anything.
        run: |
          python main.py --repo . --task "smoke" --no-git --context-only > /tmp/smoke.txt
          tail -5 /tmp/smoke.txt
          grep -q "No API call was made" /tmp/smoke.txt

      - name: No duplicate definitions
        # A merge that lands the same function twice leaves the second copy
        # shadowing the first. It imports cleanly and passes every test, so
        # nothing else here would notice -- `_apply_unified_diff` sat
        # duplicated in code_modifier.py exactly this way.
        run: |
          python - <<'PY'
          import ast, collections, os, sys

          problems = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [
                  d for d in dirs
                  if not d.startswith(".") and d not in ("node_modules", "__pycache__")
              ]
              for name in sorted(files):
                  if not name.endswith(".py"):
                      continue
                  path = os.path.join(root, name)
                  try:
                      tree = ast.parse(open(path, encoding="utf-8").read())
                  except SyntaxError:
                      continue

                  counts = collections.Counter(
                      node.name for node in tree.body
                      if isinstance(node, (ast.FunctionDef, ast.ClassDef))
                  )
                  for symbol, count in counts.items():
                      if count > 1:
                          problems.append(f"{path}: {symbol} defined {count}x")

                  for node in tree.body:
                      if not isinstance(node, ast.ClassDef):
                          continue
                      methods = collections.Counter(
                          item.name for item in node.body
                          if isinstance(item, ast.FunctionDef)
                      )
                      for symbol, count in methods.items():
                          if count > 1:
                              problems.append(
                                  f"{path}: {node.name}.{symbol} defined {count}x"
                              )

          for problem in problems:
              print(f"FAIL {problem}")

          if problems:
              sys.exit(1)

          print("no duplicate definitions")
          PY
